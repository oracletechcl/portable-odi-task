name: Portable OCI data integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_oci_output:
        description: Verify an existing OCI output prefix instead of uploading assets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate portable code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Java, Maven, and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless maven
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Validate source and scripts
        run: |
          python -m compileall src
          python -m pytest -q
          mvn -q -DskipTests package
          find platforms/oci/scripts -name "*.sh" -exec bash -n {} \;

  upload-dev:
    name: Upload demo code
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY_BASE64: ${{ secrets.OCI_PRIVATE_KEY_BASE64 }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
      OCI_BUCKET: ${{ secrets.OCI_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure OCI CLI and upload assets
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless maven
          mvn -q -DskipTests package
          python -m pip install oci-cli
          ./platforms/oci/scripts/configure-oci.sh
          ./platforms/oci/scripts/upload-code.sh
          ./platforms/oci/scripts/upload-input.sh

  verify-oci-output:
    name: Verify OCI output
    if: github.event_name == 'workflow_dispatch' && inputs.verify_oci_output
    runs-on: ubuntu-latest
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY_BASE64: ${{ secrets.OCI_PRIVATE_KEY_BASE64 }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
      OCI_BUCKET: ${{ secrets.OCI_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure OCI CLI and verify output
        run: |
          python -m pip install oci-cli
          ./platforms/oci/scripts/configure-oci.sh
          ./platforms/oci/scripts/verify-output.sh
