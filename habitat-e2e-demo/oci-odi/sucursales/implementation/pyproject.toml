[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habitat-sucursales-mock"
version = "1.0.0"
description = "Portable mock backend for the Habitat Sucursales OCI DI demo"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["habitat_sucursales"]

[tool.pytest.ini_options]
testpaths = ["tests"]
